<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%">
  <defs>
    <linearGradient id="darkThemeCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="50%" stop-color="#0c1527"/>
      <stop offset="100%" stop-color="#091224"/>
    </linearGradient>
    <radialGradient id="cyanAmbient" cx="25%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orangeAmbient" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7b00" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ff7b00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c38"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Dark Presentation Card Container -->
  <rect x="2" y="2" width="1196" height="216" rx="20" fill="url(#darkThemeCard)" stroke="#00f2fe" stroke-opacity="0.38" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="216" rx="20" fill="url(#cyanAmbient)"/>
  <rect x="2" y="2" width="1196" height="216" rx="20" fill="url(#orangeAmbient)"/>

  <!-- Inner Elevated Dark Badge Frame -->
  <rect x="330" y="32" width="540" height="156" rx="24" fill="#060b15" stroke="#1e2f4d" stroke-width="1.5"/>

  <!-- Centered Fuel&Go Logo Mark & High-Contrast White "Fuel" Typography -->
  <g transform="translate(365, 50)">
    <!-- Icon Mark -->
    <g transform="translate(10, 10)">
      <rect x="5" y="5" width="90" height="90" rx="22" fill="#0c172e" stroke="url(#blueGrad)" stroke-width="2.5"/>
      <!-- Fuel Pump Drop in Orange -->
      <path d="M 36 68 C 30 68 25 63 25 57 C 25 48 36 34 36 34 C 36 34 47 48 47 57 C 47 63 42 68 36 68 Z" fill="url(#orangeGrad)"/>
      <!-- EV Lightning Bolt in Green -->
      <polygon points="56,22 42,50 54,50 44,78 68,46 54,46 64,22" fill="url(#greenGrad)" filter="url(#glow)"/>
      <!-- Connector Ring Accent -->
      <circle cx="70" cy="70" r="6" fill="#00f2fe" opacity="0.85"/>
    </g>

    <!-- Brand Typography ("Fuel" in pure high-contrast white on #060b15 dark container) -->
    <g transform="translate(130, 54)">
      <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="50" letter-spacing="-0.03em" fill="#ffffff">
        Fuel<tspan fill="url(#orangeGrad)">&amp;</tspan><tspan fill="url(#greenGrad)">Go</tspan>
      </text>
      <text y="34" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="13.5" letter-spacing="0.2em" fill="#00f2fe">
        NEXTMIND MOBILITY PLATFORM
      </text>
    </g>
  </g>
</svg>
