<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c38"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Icon Mark -->
  <g transform="translate(10, 10)">
    <!-- Rounded Outer Shield / Hexagon -->
    <rect x="5" y="5" width="90" height="90" rx="22" fill="#0c172e" stroke="url(#blueGrad)" stroke-width="2.5" filter="drop-shadow(0px 8px 16px rgba(0,242,254,0.25))"/>
    
    <!-- Fuel Pump Drop / Flame in Orange -->
    <path d="M 36 68 C 30 68 25 63 25 57 C 25 48 36 34 36 34 C 36 34 47 48 47 57 C 47 63 42 68 36 68 Z" fill="url(#orangeGrad)"/>
    
    <!-- EV Lightning Bolt in Green & Blue Glow -->
    <polygon points="56,22 42,50 54,50 44,78 68,46 54,46 64,22" fill="url(#greenGrad)" filter="url(#glow)"/>
    
    <!-- Connector Ring Accent -->
    <circle cx="70" cy="70" r="6" fill="#00f2fe" opacity="0.8"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(125, 42)">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="-0.03em" fill="#ffffff">
      Fuel<tspan fill="url(#orangeGrad)">&amp;</tspan><tspan fill="url(#greenGrad)">Go</tspan>
    </text>
    <text y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="0.18em" fill="#00f2fe" text-transform="uppercase">
      NextMind Mobility Platform
    </text>
  </g>
</svg>
