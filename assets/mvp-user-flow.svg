<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070e1c"/>
      <stop offset="100%" stop-color="#0c172d"/>
    </linearGradient>
    <linearGradient id="wireBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="wireGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="wireOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c38"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#1a2b4c" stroke-width="2"/>

  <!-- Workflow Step Connecting Line -->
  <path d="M 230 190 L 330 190 M 530 190 L 630 190 M 830 190 L 930 190" stroke="#00f2fe" stroke-width="2.5" stroke-dasharray="6,6" opacity="0.6"/>
  <polygon points="335,190 325,185 325,195" fill="#00f2fe"/>
  <polygon points="635,190 625,185 625,195" fill="#00ff87"/>
  <polygon points="935,190 925,185 925,195" fill="#ff8c38"/>

  <!-- ==================== STEP 1: DISCOVER ==================== -->
  <g transform="translate(40, 30)">
    <!-- Device Frame -->
    <rect width="190" height="340" rx="20" fill="#060b16" stroke="url(#wireBlue)" stroke-width="2" filter="url(#shadow)"/>
    <!-- Speaker & Camera notch -->
    <rect x="65" y="8" width="60" height="8" rx="4" fill="#152238"/>
    <!-- Screen Header -->
    <text x="95" y="38" fill="#00f2fe" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" text-anchor="middle">01. SMART DISCOVER</text>
    <!-- Map Mockup Box -->
    <rect x="15" y="50" width="160" height="110" rx="10" fill="#0e1a30" stroke="#1d3154"/>
    <!-- Map Roads -->
    <path d="M 25 105 Q 95 65 165 115" stroke="#1d355e" stroke-width="6" fill="none"/>
    <path d="M 95 55 L 95 155" stroke="#1d355e" stroke-width="4" fill="none"/>
    <!-- Map Station Pins -->
    <circle cx="75" cy="90" r="9" fill="url(#wireOrange)"/>
    <text x="75" y="93" fill="#fff" font-family="sans-serif" font-size="8" font-weight="900" text-anchor="middle">⛽</text>
    <circle cx="120" cy="85" r="11" fill="url(#wireGreen)"/>
    <text x="120" y="89" fill="#060913" font-family="sans-serif" font-size="9" font-weight="900" text-anchor="middle">⚡</text>
    
    <!-- Filter Pills -->
    <rect x="15" y="170" width="48" height="18" rx="9" fill="#00f2fe" opacity="0.2"/>
    <text x="39" y="182" fill="#00f2fe" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">All Hubs</text>
    <rect x="68" y="170" width="54" height="18" rx="9" fill="#ff8c38" opacity="0.2"/>
    <text x="95" y="182" fill="#ff8c38" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">⛽ 95/Diesel</text>
    <rect x="127" y="170" width="48" height="18" rx="9" fill="#00ff87" opacity="0.2"/>
    <text x="151" y="182" fill="#00ff87" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">⚡ 150kW</text>

    <!-- Station Info Card -->
    <rect x="15" y="200" width="160" height="85" rx="10" fill="#0d182e" stroke="#1c3052"/>
    <text x="25" y="218" fill="#fff" font-family="sans-serif" font-size="10" font-weight="700">Hub Central Tel Aviv</text>
    <text x="25" y="232" fill="#94a3b8" font-family="sans-serif" font-size="8">450m • 2 mins away</text>
    <rect x="25" y="242" width="65" height="16" rx="4" fill="#00ff87" opacity="0.15"/>
    <text x="57" y="253" fill="#00ff87" font-family="sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">4 Sockets Free</text>
    <rect x="95" y="242" width="65" height="16" rx="4" fill="#ff8c38" opacity="0.15"/>
    <text x="127" y="253" fill="#ff8c38" font-family="sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">2 Pumps Free</text>
    
    <!-- CTA Button -->
    <rect x="15" y="295" width="160" height="28" rx="8" fill="url(#wireBlue)"/>
    <text x="95" y="313" fill="#060b16" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">Navigate to Hub ➔</text>
  </g>

  <!-- ==================== STEP 2: SELECT BAY ==================== -->
  <g transform="translate(340, 30)">
    <!-- Device Frame -->
    <rect width="190" height="340" rx="20" fill="#060b16" stroke="url(#wireGreen)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="65" y="8" width="60" height="8" rx="4" fill="#152238"/>
    <!-- Screen Header -->
    <text x="95" y="38" fill="#00ff87" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" text-anchor="middle">02. GEOFENCE &amp; BAY</text>

    <!-- Geofence Banner -->
    <rect x="15" y="50" width="160" height="34" rx="8" fill="#00ff87" opacity="0.12" stroke="#00ff87" stroke-width="0.8"/>
    <circle cx="28" cy="67" r="5" fill="#00ff87"/>
    <text x="38" y="65" fill="#00ff87" font-family="sans-serif" font-size="8.5" font-weight="800">Geofence Confirmed</text>
    <text x="38" y="76" fill="#94a3b8" font-family="sans-serif" font-size="7">Inside Hub Perimeter (Bay #2 Area)</text>

    <!-- Bay Option 1 (Selected) -->
    <rect x="15" y="94" width="160" height="62" rx="10" fill="#11223e" stroke="#00f2fe" stroke-width="1.5"/>
    <circle cx="32" cy="125" r="10" fill="#00f2fe" opacity="0.2"/>
    <text x="32" y="129" fill="#00f2fe" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">⚡</text>
    <text x="50" y="116" fill="#fff" font-family="sans-serif" font-size="9.5" font-weight="800">Fast Bay #2 (CCS 150kW)</text>
    <text x="50" y="130" fill="#00ff87" font-family="sans-serif" font-size="8" font-weight="700">Available • ₪1.85 / kWh</text>
    <text x="50" y="143" fill="#94a3b8" font-family="sans-serif" font-size="7.5">Max Output 400A High Voltage</text>
    <circle cx="160" cy="125" r="7" fill="#00f2fe"/>
    <polyline points="157,125 159,127 163,123" fill="none" stroke="#060b16" stroke-width="1.5"/>

    <!-- Bay Option 2 -->
    <rect x="15" y="164" width="160" height="58" rx="10" fill="#0c172d" stroke="#1a2d4e"/>
    <circle cx="32" cy="193" r="10" fill="#ff8c38" opacity="0.2"/>
    <text x="32" y="197" fill="#ff8c38" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">⛽</text>
    <text x="50" y="186" fill="#fff" font-family="sans-serif" font-size="9.5" font-weight="700">Pump #2 (Unleaded 95)</text>
    <text x="50" y="200" fill="#ff8c38" font-family="sans-serif" font-size="8">Available • ₪7.85 / Liter</text>
    <text x="50" y="212" fill="#94a3b8" font-family="sans-serif" font-size="7.5">Standard Dispenser Flow</text>

    <!-- Connector Cable Hint -->
    <rect x="15" y="232" width="160" height="52" rx="8" fill="#081020" stroke="#162744"/>
    <text x="25" y="250" fill="#94a3b8" font-family="sans-serif" font-size="8">Vehicle: Tesla Model 3 (77kWh)</text>
    <text x="25" y="264" fill="#00f2fe" font-family="sans-serif" font-size="8" font-weight="700">Estimated 20% ➔ 80%: 24 Mins</text>
    <text x="25" y="276" fill="#94a3b8" font-family="sans-serif" font-size="7">Target cost: ₪85.47</text>

    <!-- CTA Button -->
    <rect x="15" y="295" width="160" height="28" rx="8" fill="url(#wireGreen)"/>
    <text x="95" y="313" fill="#060b16" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">Lock Bay &amp; Authorize ➔</text>
  </g>

  <!-- ==================== STEP 3: ENERGIZE ==================== -->
  <g transform="translate(640, 30)">
    <!-- Device Frame -->
    <rect width="190" height="340" rx="20" fill="#060b16" stroke="url(#wireBlue)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="65" y="8" width="60" height="8" rx="4" fill="#152238"/>
    <!-- Screen Header -->
    <text x="95" y="38" fill="#00f2fe" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" text-anchor="middle">03. LIVE ENERGIZING</text>

    <!-- Circular Gauge -->
    <g transform="translate(95, 115)">
      <circle cx="0" cy="0" r="48" fill="#081122" stroke="#162846" stroke-width="7"/>
      <path d="M 0 -48 A 48 48 0 1 1 -34 34" fill="none" stroke="url(#wireGreen)" stroke-width="7" stroke-linecap="round"/>
      <text x="0" y="-8" fill="#00ff87" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">68%</text>
      <text x="0" y="8" fill="#94a3b8" font-family="sans-serif" font-size="7.5" text-anchor="middle">Current SoC</text>
      <text x="0" y="22" fill="#00f2fe" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">142 kW Fast</text>
    </g>

    <!-- Metrics Row -->
    <rect x="15" y="180" width="75" height="50" rx="8" fill="#0d182e" stroke="#1c3052"/>
    <text x="52" y="198" fill="#94a3b8" font-family="sans-serif" font-size="7" text-anchor="middle">DELIVERED</text>
    <text x="52" y="216" fill="#00f2fe" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">34.8 kWh</text>

    <rect x="100" y="180" width="75" height="50" rx="8" fill="#0d182e" stroke="#1c3052"/>
    <text x="137" y="198" fill="#94a3b8" font-family="sans-serif" font-size="7" text-anchor="middle">RUNNING COST</text>
    <text x="137" y="216" fill="#ff8c38" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">₪ 64.38</text>

    <!-- Safety Telemetry Feed -->
    <rect x="15" y="240" width="160" height="44" rx="8" fill="#0a1324" stroke="#172a48"/>
    <circle cx="28" cy="254" r="4" fill="#00ff87"/>
    <text x="38" y="257" fill="#fff" font-family="sans-serif" font-size="8" font-weight="700">IoT Telemetry: Stable</text>
    <text x="38" y="271" fill="#94a3b8" font-family="sans-serif" font-size="7">Cable Temp: 28°C • Line 398V</text>

    <!-- Stop / Complete Button -->
    <rect x="15" y="295" width="160" height="28" rx="8" fill="url(#wireOrange)"/>
    <text x="95" y="313" fill="#fff" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">End &amp; Auto-Pay ➔</text>
  </g>

  <!-- ==================== STEP 4: AUTO-PAY ==================== -->
  <g transform="translate(940, 30)">
    <!-- Device Frame -->
    <rect width="190" height="340" rx="20" fill="#060b16" stroke="url(#wireOrange)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="65" y="8" width="60" height="8" rx="4" fill="#152238"/>
    <!-- Screen Header -->
    <text x="95" y="38" fill="#ff8c38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" text-anchor="middle">04. TAX INVOICE</text>

    <!-- Success Checkmark -->
    <circle cx="95" cy="72" r="18" fill="#00ff87" opacity="0.15"/>
    <circle cx="95" cy="72" r="12" fill="#00ff87"/>
    <polyline points="90,72 94,76 101,68" fill="none" stroke="#060b16" stroke-width="2"/>
    <text x="95" y="103" fill="#fff" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">Session Paid</text>
    <text x="95" y="115" fill="#00ff87" font-family="sans-serif" font-size="8" text-anchor="middle">Via Apple Pay • Zero Touch</text>

    <!-- Digital Receipt Sheet -->
    <rect x="15" y="125" width="160" height="155" rx="8" fill="#0c172d" stroke="#1d3356" stroke-dasharray="4,4"/>
    <text x="25" y="142" fill="#00f2fe" font-family="monospace" font-size="8" font-weight="700">FUEL&amp;GO RECEIPT #8912</text>
    <text x="25" y="156" fill="#94a3b8" font-family="monospace" font-size="7">Hub Central • Bay #2 (150kW)</text>
    <text x="25" y="170" fill="#94a3b8" font-family="monospace" font-size="7">Energy: 46.20 kWh @ ₪1.85</text>
    <line x1="25" y1="178" x2="165" y2="178" stroke="#1d3356"/>
    <text x="25" y="192" fill="#94a3b8" font-family="monospace" font-size="7.5">Subtotal:</text>
    <text x="165" y="192" fill="#fff" font-family="monospace" font-size="7.5" text-anchor="end">₪ 73.05</text>
    <text x="25" y="206" fill="#94a3b8" font-family="monospace" font-size="7.5">VAT 17% (מע"מ):</text>
    <text x="165" y="206" fill="#fff" font-family="monospace" font-size="7.5" text-anchor="end">₪ 12.42</text>
    <line x1="25" y1="214" x2="165" y2="214" stroke="#1d3356"/>
    <text x="25" y="230" fill="#00ff87" font-family="monospace" font-size="9" font-weight="800">TOTAL PAID:</text>
    <text x="165" y="230" fill="#00ff87" font-family="monospace" font-size="10" font-weight="800" text-anchor="end">₪ 85.47</text>
    <text x="25" y="246" fill="#ff8c38" font-family="monospace" font-size="7.5">ICE SAVINGS: ₪165.73 (66%)</text>
    <text x="25" y="260" fill="#94a3b8" font-family="monospace" font-size="6.5">PDF synced to Enterprise ERP</text>

    <!-- Exit / Done Button -->
    <rect x="15" y="295" width="160" height="28" rx="8" fill="#142642" stroke="#00f2fe" stroke-width="1"/>
    <text x="95" y="313" fill="#00f2fe" font-family="sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Download PDF / Exit</text>
  </g>
</svg>
