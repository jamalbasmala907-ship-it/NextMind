<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="100%" stop-color="#0c1527"/>
    </linearGradient>
    <linearGradient id="triGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="55%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#ff7b00"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="orangeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8c38"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Slide Background -->
  <rect width="1200" height="540" rx="20" fill="url(#bgCanvas)" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Header Strip -->
  <g transform="translate(45, 32)">
    <circle cx="6" cy="6" r="5" fill="#00ff87"/>
    <text x="18" y="10" fill="#00ff87" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="12" letter-spacing="1.5">PYTHON COMPUTATIONAL ENGINE (V4 REAL-TIME REACTIVITY)</text>
    <text x="0" y="42" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="28">Python <tspan fill="url(#triGrad)">Cost Estimator &amp; Energy Math</tspan></text>
    <text x="0" y="66" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13.5">Real-time slider-driven EV charging vs. ICE fuel benchmark calculations in Israeli Shekels (₪) with instant DOM synchronization.</text>
  </g>

  <!-- ==================== LEFT CARD: INPUT CONTROLS ==================== -->
  <g transform="translate(45, 118)">
    <rect width="560" height="385" rx="18" fill="#0d172a" stroke="#1e2f4d" stroke-width="1.5" filter="url(#cardShadow)"/>

    <!-- Card Header -->
    <text x="28" y="38" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="15">Python Model Inputs (מחשבון עלויות)</text>
    <rect x="372" y="20" width="160" height="26" rx="6" fill="#062825" stroke="#00ff87" stroke-width="1"/>
    <circle cx="386" cy="33" r="4" fill="#00ff87"/>
    <text x="398" y="37" fill="#00ff87" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11">Pyodide v0.25 Active</text>
    <line x1="28" y1="56" x2="532" y2="56" stroke="#1e293b" stroke-width="1"/>

    <!-- Slider 1: Battery Capacity -->
    <g transform="translate(28, 76)">
      <text x="0" y="12" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13">Battery Capacity (קיבולת סוללה)</text>
      <text x="504" y="12" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" text-anchor="end">77 kWh</text>
      <rect x="0" y="24" width="504" height="7" rx="3.5" fill="#1e293b"/>
      <rect x="0" y="24" width="237" height="7" rx="3.5" fill="url(#blueAccent)"/>
      <circle cx="237" cy="27.5" r="8" fill="#00f2fe" stroke="#070d18" stroke-width="2"/>
    </g>

    <!-- Slider 2: Current SoC -->
    <g transform="translate(28, 138)">
      <text x="0" y="12" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13">Current State of Charge (רמת טעינה נוכחית)</text>
      <text x="504" y="12" fill="#ff7b00" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" text-anchor="end">20%</text>
      <rect x="0" y="24" width="504" height="7" rx="3.5" fill="#1e293b"/>
      <rect x="0" y="24" width="90" height="7" rx="3.5" fill="url(#orangeAccent)"/>
      <circle cx="90" cy="27.5" r="8" fill="#ff7b00" stroke="#070d18" stroke-width="2"/>
    </g>

    <!-- Slider 3: Target SoC -->
    <g transform="translate(28, 200)">
      <text x="0" y="12" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13">Target State of Charge (יעד טעינה)</text>
      <text x="504" y="12" fill="#00ff87" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" text-anchor="end">80%</text>
      <rect x="0" y="24" width="504" height="7" rx="3.5" fill="#1e293b"/>
      <rect x="0" y="24" width="378" height="7" rx="3.5" fill="url(#greenAccent)"/>
      <circle cx="378" cy="27.5" r="8" fill="#00ff87" stroke="#070d18" stroke-width="2"/>
    </g>

    <!-- Slider 4: EV Tariff -->
    <g transform="translate(28, 262)">
      <text x="0" y="12" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13">EV Tariff (מחיר לקוט״ש)</text>
      <text x="504" y="12" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" text-anchor="end">₪ 1.85 / kWh</text>
      <rect x="0" y="24" width="504" height="7" rx="3.5" fill="#1e293b"/>
      <rect x="0" y="24" width="242" height="7" rx="3.5" fill="url(#blueAccent)"/>
      <circle cx="242" cy="27.5" r="8" fill="#00f2fe" stroke="#070d18" stroke-width="2"/>
    </g>

    <!-- Slider 5: Fuel Benchmark Price -->
    <g transform="translate(28, 324)">
      <text x="0" y="12" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13">Fuel Benchmark Price (בנזין 95)</text>
      <text x="504" y="12" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" text-anchor="end">₪ 7.85 / Liter</text>
      <rect x="0" y="24" width="504" height="7" rx="3.5" fill="#1e293b"/>
      <rect x="0" y="24" width="266" height="7" rx="3.5" fill="url(#orangeAccent)"/>
      <circle cx="266" cy="27.5" r="8" fill="#ff7b00" stroke="#070d18" stroke-width="2"/>
    </g>
  </g>

  <!-- ==================== RIGHT CARD: REAL-TIME NUMERICAL OUTPUT ==================== -->
  <g transform="translate(635, 118)">
    <rect width="520" height="385" rx="18" fill="#0d172a" stroke="#00ff87" stroke-opacity="0.4" stroke-width="1.5" filter="url(#cardShadow)"/>

    <!-- Primary Cost Display -->
    <text x="28" y="38" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" letter-spacing="1.2">ESTIMATED SESSION COST (עלות טעינה)</text>
    <text x="28" y="84" fill="#00ff87" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="42">₪ 85.47</text>

    <!-- Primary Metric Tiles (Energy & ICE Equiv) -->
    <g transform="translate(28, 104)">
      <rect width="224" height="76" rx="12" fill="#111d35" stroke="#1e2f4d"/>
      <text x="16" y="26" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" letter-spacing="0.8">ENERGY TO DELIVER</text>
      <text x="16" y="56" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="23">46.2 kWh</text>

      <rect x="240" width="224" height="76" rx="12" fill="#111d35" stroke="#1e2f4d"/>
      <text x="256" y="26" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" letter-spacing="0.8">ICE EQUIVALENT COST</text>
      <text x="256" y="56" fill="#ff7b00" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="23">₪ 151.11</text>
    </g>

    <!-- Direct Driver Savings Banner -->
    <g transform="translate(28, 196)">
      <rect width="464" height="54" rx="12" fill="#062825" stroke="#00ff87" stroke-opacity="0.5"/>
      <text x="18" y="32" fill="#00ff87" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15">Direct Driver Savings:</text>
      <text x="446" y="33" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="19" text-anchor="end">₪ 65.64 (43%)</text>
    </g>

    <!-- Clean Efficiency & Range Tiles -->
    <g transform="translate(28, 266)">
      <rect width="224" height="62" rx="12" fill="#111d35" stroke="#1e2f4d"/>
      <text x="16" y="22" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10.5" letter-spacing="0.6">EST. DRIVING RANGE ADDED</text>
      <text x="16" y="47" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="18">256.7 km</text>

      <rect x="240" width="224" height="62" rx="12" fill="#111d35" stroke="#1e2f4d"/>
      <text x="256" y="22" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10.5" letter-spacing="0.6">EQUIV. PETROL DISPLACED</text>
      <text x="256" y="47" fill="#ff7b00" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="18">19.3 Liters</text>
    </g>

    <!-- Clean Formula Caption -->
    <text x="28" y="352" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">* Assumptions: Energy (kWh) = Capacity × (Δ% / 100). Benchmark ICE: 7.5 L/100km, EV: 18 kWh/100km.</text>
    <text x="28" y="368" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">  Clean real-time numerical rendering — zero console clutter.</text>
  </g>
</svg>
